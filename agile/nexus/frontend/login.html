<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NEXUS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <h1>NEXUS</h1>
                <p class="tagline">AI-Driven Knowledge Exchange</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <div class="form-options">
                    <a href="#" id="forgotPasswordLink" class="link">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary">Login</button>
                
                <div class="form-footer">
                    <p>Don't have an account? <a href="signup.html" class="link">Sign Up</a></p>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Reset Password</h2>
            
            <div id="emailStep">
                <p>Enter your email to receive an OTP</p>
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" required placeholder="Enter your email">
                </div>
                <button id="sendOtpBtn" class="btn btn-primary">Send OTP</button>
            </div>
            
            <div id="otpStep" style="display: none;">
                <p>Enter the OTP sent to your email</p>
                <div class="form-group">
                    <label for="otp">OTP</label>
                    <input type="text" id="otp" maxlength="6" required placeholder="Enter 6-digit OTP">
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="Confirm new password">
                </div>
                <button id="resetPasswordBtn" class="btn btn-primary">Reset Password</button>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <script src="js/auth.js"></script>
</body>
</html>
